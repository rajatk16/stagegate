server {
  listen 8080 default_server;
  listen [::]:8080 default_server;

  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok/n";
  }

  location = /api {
    return 404;
  }

  location ^~ /api/ {
    return 404;
  }

  location ^~ /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location ~* \.(?:js|mjs|css|map|json|png|jpg|jpeg|gif|svg|ico|webp|avif|woff|woff2|ttf|txt|webmanifest)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}