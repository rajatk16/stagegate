server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;

  client_max_body_size 1m;

  gzip on;
  gzip_min_length 1024;

  gzip_types
    text/plain
    text/css
    application/json
    application/javascript
    application/xml
    image/svg+xml;

  # Baseline security headers.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Docker's embedded DNS resolver.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  set $api_upstream http://api:4000;

  # Nginx container health.
  location = /healthz {
    access_log off;

    default_type text/plain;

    return 200 "ok\n";
  }

  # NestJS API.
  location /api/ {
    proxy_pass $api_upstream$request_uri;

    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header Connection "";

    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    proxy_intercept_errors off;
  }

  # Explicitly proxy the existing raw health endpoints.
  location = /health/live {
    proxy_pass $api_upstream$request_uri;

    proxy_set_header Host $host;

    proxy_connect_timeout 5s;
    proxy_read_timeout 5s;

    proxy_intercept_errors off;
  }

  location = /health/ready {
    proxy_pass $api_upstream$request_uri;
    proxy_set_header Host $host;
    proxy_connect_timeout 5s;
    proxy_read_timeout 5s;
    proxy_intercept_errors off;
  }

  # Swagger is not exposed by the production frontend.
  location = /docs {
    return 404;
  }

  location ^~ /docs/ {
    return 404;
  }

  # Vite-generated hashed assets.
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # Avoid serving stale application entry points.
  location = /index.html {
    expires -1;
    try_files $uri =404;
  }

  # React Router SPA fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Block hidden files.
  location ~ /\.(?!well-known) {
    deny all;
  }
}
