name: Backend CI

on:
  pull_request:
    branches: [main]

  merge_group:
    types: [checks_requested]

  workflow_call:
    inputs:
      upload_image:
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up npm
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@11.19.0

      - name: Install dependencies
        run: npm ci

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Run backend checks
        run: npm run check:api

      - name: Validate Firestore index JSON
        run: python3 -m json.tool firestore.indexes.json > /dev/null

      - name: Build production image
        run: |
          docker build \
            --file apps/api/Dockerfile \
            --tag stagegate-api:ci \
            .

      - name: Test Firebase rules and backend readiness
        run: |
          npx --no-install firebase emulators:exec \
            --project demo-stagegate-ci \
            --only auth,firestore,storage \
            "node --test scripts/ci/firebase-rules.test.mjs && bash scripts/ci/backend-smoke.sh"

      - name: Save tested image
        if: inputs.upload_image
        run: |
          docker save stagegate-api:ci \
            --output "$RUNNER_TEMP/stagegate-api.tar"

      - name: Upload tested image
        if: inputs.upload_image
        uses: actions/upload-artifact@v7
        with:
          name: backend-image-${{ github.sha }}
          path: ${{ runner.temp }}/stagegate-api.tar
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
