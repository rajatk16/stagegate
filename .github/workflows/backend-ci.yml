name: Backend CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up npm
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@11.19.0

      - name: Install dependencies
        run: npm ci

      - name: Run backend checks
        run: npm run check:api

      - name: Build production image
        run: |
          docker build \
            --file apps/api/Dockerfile \
            --tag stagegate-api:ci \
            .

      - name: Check container startup and shutdown
        shell: bash
        run: |
          set -euo pipefail

          docker run --detach \
            --name stagegate-api-ci \
            --publish 127.0.0.1:3000:3000 \
            --env NODE_ENV=production \
            --env PORT=3000 \
            --env FRONTEND_ORIGIN=http://localhost:5173 \
            --env FIREBASE_MODE=live \
            --env FIREBASE_PROJECT_ID=stagegate-ci-smoke \
            --env SHUTDOWN_TIMEOUT_MS=8000 \
            stagegate-api:ci

          ready=0

          for attempt in $(seq 1 60); do
            if curl --fail --silent \
              http://127.0.0.1:3000/api/v1/health \
              >/dev/null; then
              ready=1
              break
            fi

            sleep 1
          done

          test "$ready" = 1

          docker stop --time 45 stagegate-api-ci

          exit_code="$(docker inspect \
            --format '{{.State.ExitCode}}' \
            stagegate-api-ci)"

          test "$exit_code" = 0

      - name: Show container logs on failure
        if: failure()
        run: docker logs stagegate-api-ci || true

      - name: Remove test container
        if: always()
        run: docker rm --force stagegate-api-ci || true
