name: stagegate-production

services:
  api:
    image: stagegate-api:${STAGEGATE_IMAGE_TAG:-local}

    build:
      context: .
      dockerfile: infrastructure/docker/api/Dockerfile
      args:
        NODE_IMAGE: node:24-bookworm-slim
        NPM_VERSION: 11.6.2
        TURBO_VERSION: 2.5.8

    init: true

    restart: unless-stopped

    env_file:
      - ./infrastructure/docker/env/production.env

    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "4000"

    expose:
      - "4000"

    networks:
      - backend

    read_only: true

    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    stop_signal: SIGTERM

    stop_grace_period: 45s

    healthcheck:
      test:
        - CMD
        - node
        - /workspace/healthcheck.mjs
        - http://127.0.0.1:4000/health/ready
        - "200"
        - "3000"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    mem_limit: 1g

    cpus: 1.0

    pids_limit: 256

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    image: stagegate-web:${STAGEGATE_IMAGE_TAG:-local}

    build:
      context: .
      dockerfile: infrastructure/docker/web/Dockerfile
      args:
        NODE_IMAGE: node:24-bookworm-slim
        NGINX_IMAGE: nginxinc/nginx-unprivileged:stable-alpine
        NPM_VERSION: 11.6.2
        TURBO_VERSION: 2.5.8
        VITE_APP_NAME: StageGate
        VITE_API_BASE_URL: /api/v1
        VITE_APP_ENV: production
        VITE_ENABLE_QUERY_DEVTOOLS: "false"

    init: true

    restart: unless-stopped

    ports:
      - "127.0.0.1:${STAGEGATE_WEB_PORT:-8088}:8080"

    depends_on:
      api:
        condition: service_healthy

    networks:
      - frontend
      - backend

    read_only: true

    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,uid=101,gid=101,mode=1777

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    stop_signal: SIGQUIT

    stop_grace_period: 30s

    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/healthz
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    mem_limit: 128m

    cpus: 0.5

    pids_limit: 128

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  frontend:
    driver: bridge

  backend:
    driver: bridge
