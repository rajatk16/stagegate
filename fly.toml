app = "stagegate-api"
primary_region = "sin"

kill_signal = "SIGTERM"
kill_timeout = 15

[build]
  dockerfile = "apps/api/Dockerfile"

[deploy]
  strategy = "rolling"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  FRONTEND_ORIGIN = "https://stagegate-web.fly.dev"

  FIREBASE_MODE = "live"
  FIREBASE_PROJECT_ID = "stagegate-c6df0"

  GOOGLE_APPLICATION_CREDENTIALS = "/app/firebase-admin.json"
  SHUTDOWN_TIMEOUT_MS = "8000"

  [[files]]
    guest_path = "/app/firebase-admin.json"
    secret_name = "FIREBASE_ADMIN_CREDENTIALS_B64"

  [http_service]
    internal_port = 3000
    force_https = true
    auto_stop_machines = "off"
    auto_start_machines = true
    min_machines_running = 1

    [[http_service.checks]]
      method = "GET"
      path = "/api/v1/health"
      interval = "15s"
      timeout = "3s"
      grace_period = "20s"

  [[vm]]
    cpu_kind = "shared"
    cpus = 1
    memory = "512mb"
